# Authelia configuration. Secrets are injected via AUTHELIA_* environment
# variables (see authelia/.env) — do NOT put secrets here.
# Edit the hosts/domain placeholders for your deployment. The session cookie
# `domain` MUST be a parent of both the portal host and the protected UI host
# (e.g. auth.example.com + openclaw.example.com both under example.com).
# Also edit `totp.issuer` below — it is the label authenticator apps show on enrollment.

theme: light

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

totp:
  issuer: example.com
  period: 30
  skew: 1

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users.yml
    watch: false
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# Force two-factor (password + TOTP) for everything by default.
access_control:
  default_policy: two_factor

session:
  name: authelia_session
  same_site: lax
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://auth.example.com'
      default_redirection_url: 'https://example.com'
  redis:
    host: infra-redis
    port: 6379
    database_index: 2

storage:
  local:
    path: /data/db.sqlite3

# Single-operator homelab: write TOTP enrollment links to a file (read it once to
# enroll). Switch to notifier.smtp pointed at infra-mailpit if you prefer email.
notifier:
  filesystem:
    filename: /data/notification.txt
