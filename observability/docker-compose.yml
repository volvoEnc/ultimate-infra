x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  loki:
    image: grafana/loki:3.1.0
    container_name: infra-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    networks:
      - observability
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.0
    container_name: infra-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    networks:
      - observability
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: infra-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - observability
      - proxy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.4
    container_name: infra-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: ${TZ}
    networks:
      - observability
      - proxy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.tls.options=default@file
      - traefik.http.routers.grafana.middlewares=default-chain@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: infra-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run)($|/)
    pid: host
    networks:
      - observability
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: infra-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - observability
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging: *default-logging

volumes:
  grafana-data:
    name: observability-grafana-data
  loki-data:
    name: observability-loki-data
  prometheus-data:
    name: observability-prometheus-data
  promtail-positions:
    name: observability-promtail-positions

networks:
  observability:
    name: observability
  proxy:
    external: true
    name: ${PROXY_NETWORK}
