server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker embedded DNS, consulted at request time instead of once at nginx
    # startup. The stack then survives `app` being recreated with a new IP and
    # any container start order after a host reboot (dockerd ignores
    # depends_on there).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        # The unique container name, never the bare service name `app`: `web`
        # also sits on the shared `proxy` network, where other stacks expose
        # their own `app` service, and Docker DNS may answer with theirs.
        set $fpm_upstream freelance-prod-app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
